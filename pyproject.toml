[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alphagenome-variant-scorer"
version = "0.1.0.dev0"
description = "Cross-platform AlphaGenome variant scoring CLI with shared caching"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alphagenome==0.9.0",
    "pyfaidx==0.9.0.4",
    "tomli-w>=1.2,<2",
    "filelock>=3.16,<4",
    "numpy>=2,<3",
    "grpcio>=1.71,<2",
]

[project.scripts]
alphagenome-variant-scorer = "alphagenome_variant_scorer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
