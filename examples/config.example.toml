schema_version = 1

[reference]
assembly = "GRCh38"
fasta = "/path/to/hg38.fa"
# Optional: store the index outside a read-only FASTA directory.
index = "/path/to/writable/hg38.fa.fai"

[cache]
directory = "/path/to/shared-cache"

